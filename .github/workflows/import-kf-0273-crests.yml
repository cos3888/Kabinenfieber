name: Import KF 0.27.3 club crests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-kf-0273-crests.yml"

permissions:
  contents: write

jobs:
  import-crests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install import tools
        run: |
          python3 -m pip install --disable-pip-version-check "gdown==5.2.0" "Pillow>=11,<13"

      - name: Download Drive crest folders with retries
        shell: bash
        run: |
          set -u
          rm -rf _crest_source
          mkdir -p _crest_source

          download_folder() {
            local name="$1"
            local url="$2"
            mkdir -p "_crest_source/$name"
            local ok=0
            for attempt in 1 2 3; do
              echo "Downloading $name (attempt $attempt)"
              if gdown --folder "$url" -O "_crest_source/$name"; then
                ok=1
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$ok" -ne 1 ]; then
              echo "WARNING: folder $name did not complete; continuing so final coverage check can identify exact gaps."
            fi
          }

          download_folder "Deutschland_1" "https://drive.google.com/drive/folders/1VYJ_am-fmzRqJj81w52hcoyptbUWh-mz"
          download_folder "Deutschland_2" "https://drive.google.com/drive/folders/1OUSn-K3Y13RASC9FJClpxelgsMXUb28T"
          download_folder "Deutschland_3" "https://drive.google.com/drive/folders/1eY_Tpf9QCn6oLb-SNBMDiHJ7cWp1Auoc"
          download_folder "England_1" "https://drive.google.com/drive/folders/1qKYTY0a9u-kVFvFKDVf-JUqVMACZuOkU"
          download_folder "England_2" "https://drive.google.com/drive/folders/1WbobYF8wZOJTVKpzXKGtw8sYPA-mJds4"
          download_folder "England_3" "https://drive.google.com/drive/folders/1ateI_d9qvtIwVDKRa3tAFRTqNRbvLcQS"
          download_folder "Spanien_1" "https://drive.google.com/drive/folders/1QPHuFNL3S7NcouYAnuZ577ma75yfGz67"
          download_folder "Spanien_2" "https://drive.google.com/drive/folders/1L6frxT47knNLP17OWPojjNRw1p0NleaH"
          download_folder "Spanien_3" "https://drive.google.com/drive/folders/1l2EYY1NxjThkKldZm23Kw1ZoYqjYtki7"
          download_folder "Frankreich_1" "https://drive.google.com/drive/folders/1sh0sRYqJyEVzFBRZqG3cJXBBQnBguvin"
          download_folder "Frankreich_2" "https://drive.google.com/drive/folders/1CSUQnye9emrODSpy3maDfTGNAgo1yLPO"
          download_folder "Frankreich_3" "https://drive.google.com/drive/folders/1G7h_mLAreEGLJtm4LmVh0HCQoUebT3LY"
          download_folder "Italien_1" "https://drive.google.com/drive/folders/1KnwOmjO6Y-zSVVHFsIuv0kL8flw60GNu"
          download_folder "Italien_2" "https://drive.google.com/drive/folders/1Ub0vPcj5sJeZsKlwdNM-H30pKR8vLcPu"
          download_folder "Italien_3" "https://drive.google.com/drive/folders/1KZ97iB3VYs1Iay2R3cSSlgDEh7NVInfI"
          download_folder "Portugal_1" "https://drive.google.com/drive/folders/1-7fDiFKyza9i6tJittPEMbPNOiyiV-GH"
          download_folder "Portugal_2" "https://drive.google.com/drive/folders/16P29UoK8UlMwsLI6mfsI6tmINd9UDJPy"
          download_folder "Portugal_3" "https://drive.google.com/drive/folders/1vw8-BauaDpSDLAH5q3zNVcqhJ0x09lzq"
          download_folder "Türkei_1" "https://drive.google.com/drive/folders/1kmMNO9962E9DhTXKS-vnsQn29B0BZCyA"
          download_folder "Türkei_2" "https://drive.google.com/drive/folders/1ZAe1GDDiFs-4nFULpHNFB8Atp3Rz8WNx"
          download_folder "Türkei_3" "https://drive.google.com/drive/folders/1zbCV1EOM6-a-NiKYN-NKjLW1R865hAqR"
          download_folder "Niederlande_1" "https://drive.google.com/drive/folders/1fuHmpemun9tj6ovYzTTB1g9XVICN9Hq4"
          download_folder "Niederlande_2" "https://drive.google.com/drive/folders/1t7UF2_Ju2Wz9eu_wIRSrFi2WndjJDwx4"
          download_folder "Niederlande_3" "https://drive.google.com/drive/folders/1NNhAXPNUKuZuZ4OAblNlZ2LybxNI1pFU"

          # The Turkey-3 source uses FC_Ayvalik_Kiyi although the current fictional club is SC Ayvalik Kiyi.
          # This is the only intentional filename alias. The eight unrelated Turkey-3 files remain unmatched.
          if [ -f "_crest_source/Türkei_3/FC_Ayvalik_Kiyi.png" ]; then
            cp "_crest_source/Türkei_3/FC_Ayvalik_Kiyi.png" "_crest_source/Türkei_3/SC Ayvalık Kıyı.png"
          fi

          echo "Downloaded PNG count:"
          find _crest_source -type f -iname '*.png' | wc -l

      - name: Import crests by current club identity
        run: |
          node tools/import_club_crests.js _crest_source > /tmp/crest-import.json
          cat /tmp/crest-import.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/crest-import.json','utf8'));
          if(r.imported!==424 || r.missing!==8 || r.ambiguous!==0){
            console.error('Unexpected crest import coverage', {imported:r.imported,missing:r.missing,ambiguous:r.ambiguous});
            process.exit(1);
          }
          NODE

      - name: Optimize runtime crest PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path("assets/clubs").glob("*/crest.png"))
          for path in files:
              with Image.open(path) as im:
                  im.load()
                  if im.width > 512 or im.height > 512:
                      im.thumbnail((512, 512), Image.Resampling.LANCZOS)
                  if im.mode not in ("RGBA", "RGB", "P", "LA", "L"):
                      im = im.convert("RGBA")
                  im.save(path, format="PNG", optimize=True, compress_level=9)
          print({"optimized": len(files)})
          PY

      - name: Verify exact coverage and runtime size
        run: |
          node tools/check_club_assets.js > /tmp/assets.json
          cat /tmp/assets.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/assets.json','utf8'));
          const expected=[
            'tur3_fc_kapidag',
            'tur3_sc_marmara_adasi',
            'tur3_fc_artvin_yayla',
            'tur3_sc_rize_cay',
            'tur3_fc_harran_ovasi',
            'tur3_sc_mardin_tas',
            'tur3_fc_tunceli_munzur',
            'tur3_sc_erzincan_yayla'
          ].sort();
          const actual=r.missingCrests.map(x=>x.clubId).sort();
          if(r.totalClubs!==432 || r.crests.present!==424 || r.crests.missing!==8 || JSON.stringify(actual)!==JSON.stringify(expected)){
            console.error('Unexpected final crest state', {crests:r.crests,actual});
            process.exit(1);
          }
          if(r.kitDesigner.missing!==0){
            console.error('Kit designer asset regression',r.kitDesigner);
            process.exit(1);
          }
          NODE
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path("assets/clubs").glob("*/crest.png"))
          total=sum(p.stat().st_size for p in files)
          print({"crestFiles":len(files),"totalBytes":total,"MiB":round(total/1024/1024,2)})
          PY

      - name: Update KF 0.27.3 version and documentation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,s)=>{fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,s);};

          const pkg=JSON.parse(read('package.json'));
          pkg.version='0.27.3';
          pkg.scripts=pkg.scripts||{};
          pkg.scripts['test:0273']='node tests/run_kf_0_27_3_club_crest_integration_test.js';
          write('package.json',JSON.stringify(pkg,null,2)+'\n');

          let app=read('src/app.bundle.js');
          app=app.replace("var KF_VERSION = '0.27.2';","var KF_VERSION = '0.27.3';")
                 .replace("var KF_BUILD_LABEL = 'KF_0.27.2 - Repository / Asset Cleanup';","var KF_BUILD_LABEL = 'KF_0.27.3 - Club Crest Integration';");
          write('src/app.bundle.js',app);

          let html=read('index.html').replace(/KF_0\.27\.2/g,'KF_0.27.3');
          write('index.html',html);

          for(const name of fs.readdirSync('tests')){
            if(!name.endsWith('.js'))continue;
            const p='tests/'+name;
            let s=read(p).replace(/KF_0\.27\.2/g,'KF_0.27.3').replace(/version==='0\.27\.2'/g,"version==='0.27.3'").replace(/var KF_VERSION = '0\.27\.2';/g,"var KF_VERSION = '0.27.3';");
            write(p,s);
          }

          write('tests/run_kf_0_27_3_club_crest_integration_test.js',`const fs=require('fs'),path=require('path');
          const root=path.resolve(__dirname,'..');
          const read=r=>fs.readFileSync(path.join(root,r),'utf8');
          const db=JSON.parse(read('data/db3_vereine/db3_vereine_final.json'));
          const missing=[],oversized=[];
          for(const club of db.clubs){
            const p=path.join(root,club.crestAsset);
            if(!fs.existsSync(p)){missing.push(club.clubId);continue;}
            if(fs.statSync(p).size>2*1024*1024)oversized.push({clubId:club.clubId,bytes:fs.statSync(p).size});
          }
          const expected=['tur3_fc_kapidag','tur3_sc_marmara_adasi','tur3_fc_artvin_yayla','tur3_sc_rize_cay','tur3_fc_harran_ovasi','tur3_sc_mardin_tas','tur3_fc_tunceli_munzur','tur3_sc_erzincan_yayla'].sort();
          const report={passed:db.clubs.length===432&&432-missing.length===424&&JSON.stringify(missing.sort())===JSON.stringify(expected)&&oversized.length===0,totalClubs:db.clubs.length,present:432-missing.length,missing:missing.sort(),oversized};
          console.log(JSON.stringify(report,null,2));
          process.exit(report.passed?0:1);
          `.replace(/^          /gm,''));

          let suite=read('tests/run_current_regression_suite.js');
          if(!suite.includes('run_kf_0_27_3_club_crest_integration_test.js')) suite=suite.replace("'tests/run_kf_0_27_2_repository_asset_cleanup_test.js'","'tests/run_kf_0_27_2_repository_asset_cleanup_test.js',\n  'tests/run_kf_0_27_3_club_crest_integration_test.js'");
          write('tests/run_current_regression_suite.js',suite);

          let status=read('docs/assets/Vereinswappen_Status.md');
          status=status.replace('Stand: 2026-09-24','Stand: 2026-09-24')
            .replace('Nach Abgleich über normalisierte Vereinsnamen sind 424 Dateien den aktuellen Vereinen eindeutig zuordenbar.','KF_0.27.3 hat 424 Wappen in die stabilen \`clubId\`-Pfade integriert. Die Runtime-Dateien wurden auf maximal 512×512 Pixel optimiert; Google Drive bleibt die Master-/Importquelle.')
            .replace('Noch nicht passend vorhanden sind die Wappen für:','Weiterhin nicht passend vorhanden sind die Wappen für:');
          if(!status.includes('## Runtime-Stand KF_0.27.3')) status += `

          ## Runtime-Stand KF_0.27.3

          - 432 Vereine insgesamt
          - 424 echte Wappen im Repository
          - 8 kontrollierte Fallback-Faelle in Tuerkei 3
          - Zielpfad immer \`assets/clubs/<clubId>/crest.png\`
          - Runtime-Wappen maximal 512×512 PNG; Drive behaelt die hochaufgeloesten Originale
          `.replace(/^          /gm,'');
          write('docs/assets/Vereinswappen_Status.md',status);

          let human=read('docs/projekt/Beschreibung_Projekt_fuer_Menschen.md')
            .replace('# Kabinenfieber - Stand KF_0.27.2','# Kabinenfieber - Stand KF_0.27.3')
            .replace('App-Version: \`KF_0.27.2\`','App-Version: \`KF_0.27.3\`');
          human += `

          ## 19. KF_0.27.3 - Vereinswappen-Integration

          - 424 der 432 aktuellen Vereine besitzen nun ihr echtes Wappen unter \`assets/clubs/<clubId>/crest.png\`.
          - Google Drive ist nur die Master-/Importquelle; die technische Laufzeitreferenz bleibt \`clubId\` + \`crestAsset\`.
          - Die Runtime-Wappen wurden auf maximal 512×512 Pixel optimiert, um die Web-/Pages-Auslieferung klein zu halten.
          - Acht Tuerkei-3-Vereine bleiben bewusst auf dem bestehenden Fallback, weil in der Quelle stattdessen acht nicht zu den aktuellen fiktiven Vereinen passende Dateien liegen.
          - Keine Gameplay-, Simulations- oder Persistenzlogik wurde geaendert; das World-Schema bleibt \`kf-core-0.27.2\` / \`kf-world-record-0.27.2\`.
          `.replace(/^          /gm,'');
          write('docs/projekt/Beschreibung_Projekt_fuer_Menschen.md',human);

          let restore=read('docs/projekt/Wiederherstellung_Projekt_fuer_ChatGPT.md')
            .replace('# Wiederherstellung Kabinenfieber - KF_0.27.2','# Wiederherstellung Kabinenfieber - KF_0.27.3')
            .replace('Version: \`KF_0.27.2\`','Version: \`KF_0.27.3\`')
            .replace('\`KF_0.27.2 - Repository / Asset Cleanup\`','\`KF_0.27.3 - Club Crest Integration\`')
            .replace('Aktuelle ZIP nach Export soll \`KF_0.27.2.zip\` heissen.','Aktuelle ZIP nach Export soll \`KF_0.27.3.zip\` heissen.');
          restore += `

          ## KF_0.27.3 - Vereinswappen

          424 aktuelle Vereine besitzen echte, optimierte Runtime-Wappen unter \`assets/clubs/<clubId>/crest.png\`. Die acht offenen Tuerkei-3-IDs sind:
          \`tur3_fc_kapidag\`, \`tur3_sc_marmara_adasi\`, \`tur3_fc_artvin_yayla\`, \`tur3_sc_rize_cay\`, \`tur3_fc_harran_ovasi\`, \`tur3_sc_mardin_tas\`, \`tur3_fc_tunceli_munzur\`, \`tur3_sc_erzincan_yayla\`.

          Drive-Dateinamen duerfen niemals Runtime-Wahrheit werden. Zuordnung nur einmalig beim Import; danach ist \`clubId\`/\`crestAsset\` kanonisch. Hochaufgeloeste Masterdateien bleiben ausserhalb des Repositories in Drive; Runtime-PNGs sind maximal 512×512.
          `.replace(/^          /gm,'');
          write('docs/projekt/Wiederherstellung_Projekt_fuer_ChatGPT.md',restore);

          let readme=read('README.md').replace('# Kabinenfieber KF_0.27.2','# Kabinenfieber KF_0.27.3');
          if(!readme.includes('## Neu in KF_0.27.3')) readme=readme.replace('## Neu in KF_0.27.2',`## Neu in KF_0.27.3

          - 424 aktuelle Vereinswappen aus der freigegebenen Drive-Masterquelle integriert.
          - Runtime-Wappen nach \`clubId\` abgelegt und auf maximal 512×512 PNG optimiert.
          - 8 nicht belegbare Tuerkei-3-Wappen bleiben kontrollierte Fallbacks.
          - keine Gameplay-/Simulations-/Persistenzaenderung; World-Schema bleibt auf 0.27.2.

          ## Grundlage KF_0.27.2`.replace(/^          /gm,''));
          write('README.md',readme);

          write('reports/kf_0.27.3_release_notes.md',`# KF_0.27.3 - Vereinswappen-Integration

          424 eindeutig belegbare Vereinswappen wurden aus der freigegebenen Google-Drive-Masterquelle importiert, nach \`clubId\` abgelegt und fuer die Runtime auf maximal 512×512 PNG optimiert.

          Acht aktuelle Tuerkei-3-Vereine bleiben bewusst Fallbackfaelle; die dort vorhandenen acht abweichenden Quelldateien wurden nicht nach Reihenfolge oder unscharf zugeordnet.

          Keine Gameplay-, Simulations- oder Persistenzlogik wurde veraendert.
          `.replace(/^          /gm,''));
          NODE

      - name: Validate KF 0.27.3
        run: |
          node --check src/app.bundle.js
          node tests/run_current_source_integrity_test.js
          node tests/run_current_data_truth_invariants_test.js
          node tests/run_kf_0_27_2_repository_asset_cleanup_test.js
          node tests/run_kf_0_27_3_club_crest_integration_test.js
          node tools/check_club_assets.js > /tmp/final-assets.json
          cat /tmp/final-assets.json

      - name: Commit validated crests
        run: |
          rm -rf _crest_source
          rm -f .github/workflows/import-kf-0273-crests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "KF_0.27.3 integrate club crests"
          git push origin main
