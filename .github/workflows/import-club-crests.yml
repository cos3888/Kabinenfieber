name: One-time club crest import

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-club-crests.yml"

permissions:
  contents: write

jobs:
  import-crests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Google Drive downloader
        run: python3 -m pip install --disable-pip-version-check "gdown==5.2.0"

      - name: Download crest source folder
        run: |
          rm -rf _crest_source
          gdown --folder "https://drive.google.com/drive/folders/1quyqOf1M3byrR5z2v_YLrXhqP3AlZmdU" -O _crest_source

      - name: Import crests by club name
        run: node tools/import_club_crests.js _crest_source

      - name: Verify expected crest coverage
        run: |
          node tools/check_club_assets.js > /tmp/club-assets.json
          cat /tmp/club-assets.json
          node -e "const r=require('/tmp/club-assets.json'); if(r.totalClubs!==432 || r.crests.present!==424 || r.crests.missing!==8){ console.error('Unexpected crest coverage',r.crests); process.exit(1); }"

      - name: Commit imported crests
        run: |
          rm -rf _crest_source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clubs
          if git diff --cached --quiet; then
            echo "No crest changes to commit."
            exit 0
          fi
          git commit -m "Import club crests"
          git push origin main
