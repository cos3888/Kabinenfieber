name: KF 0.29.0 backend validation

on:
  push:
    branches:
      - kf-0.29.0-user-runtime-save-load
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check server/index.js
          node --check server/services/auth-service.js
          node --check server/services/world-runtime-manager.js
          node --check server/services/world-session-service.js
          node --check server/auth/file-auth-repository.js
          node --check server/auth/firestore-auth-repository.js
          node --check server/persistence/world-persistence-service.js
      - name: KF 0.28.0 persistence foundation
        run: node tests/run_kf_0_28_0_backend_persistence_foundation_test.js
      - name: KF 0.28.1 cloud verification regression
        run: node tests/run_kf_0_28_1_cloud_persistence_verification_test.js
      - name: KF 0.29.0 auth runtime save-load
        run: node tests/run_kf_0_29_0_user_runtime_save_load_test.js
