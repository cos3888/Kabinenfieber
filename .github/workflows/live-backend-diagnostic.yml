name: Live backend diagnostic
on:
  push:
    branches:
      - diagnostic-live-backend
jobs:
  probe:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Probe repeated persistence runtime
        run: |
          set -e
          for i in $(seq 1 20); do
            curl -sS -H 'Origin: https://cos3888.github.io' \
              'https://kabinenfieber-backend-458781449503.us-central1.run.app/api/v1/persistence/status'
            echo
            sleep 0.15
          done
