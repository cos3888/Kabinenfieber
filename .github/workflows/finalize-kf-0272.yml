name: Finalize KF 0.27.2 validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-kf-0272.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update tests and documentation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.cwd(),p=r=>path.join(root,r);
          const read=r=>fs.readFileSync(p(r),'utf8');
          const write=(r,v)=>{fs.mkdirSync(path.dirname(p(r)),{recursive:true});fs.writeFileSync(p(r),v);};
          const replaceReq=(s,a,b,label)=>{if(!s.includes(a))throw new Error('Missing '+label);return s.replace(a,b);};

          // All regression sources must expect the current runtime/schema.
          for(const name of fs.readdirSync(p('tests'))){
            if(!name.endsWith('.js'))continue;
            const rel='tests/'+name;let s=read(rel);
            s=s.replace(/KF_0\.27\.1/g,'KF_0.27.2')
              .replace(/kf-core-0\.27\.1/g,'kf-core-0.27.2')
              .replace(/kf-world-record-0\.27\.1/g,'kf-world-record-0.27.2')
              .replace(/gameVersion==='0\.27\.1'/g,"gameVersion==='0.27.2'")
              .replace(/version==='0\.27\.1'/g,"version==='0.27.2'")
              .replace(/var KF_VERSION = '0\.27\.1';/g,"var KF_VERSION = '0.27.2';")
              .replace(/KF_VERSION = '0\.27\.1';/g,"KF_VERSION = '0.27.2';");
            write(rel,s);
          }

          // 0.25.2: finance event count from external ledger.
          {
            let s=read('tests/run_kf_0_25_2_fix_regression_test.js');
            s=replaceReq(s,"window.KFCurrentBonusTest={kf021PaySeasonPlayerBonus,kf0261BonusKeySeen};","window.KFCurrentBonusTest={kf021PaySeasonPlayerBonus,kf0261BonusKeySeen,financeEventsForSeason};",'0252 export');
            s=replaceReq(s,"const beforeBonus=(w.history.bonusEvents||[]).length,beforeFinance=((w.clubFinances.byClub[p.clubId]||{}).financeEvents||[]).length;","const beforeBonus=(w.history.bonusEvents||[]).length,beforeFinance=B.financeEventsForSeason(w,p.clubId,Number(w.meta.seasonNumber||1)).length;",'0252 before finance');
            s=replaceReq(s,"const afterBonus=(w.history.bonusEvents||[]).length,afterFinance=((w.clubFinances.byClub[p.clubId]||{}).financeEvents||[]).length;","const afterBonus=(w.history.bonusEvents||[]).length,afterFinance=B.financeEventsForSeason(w,p.clubId,season).length;",'0252 after finance');
            s=s.replace('FinanceEvents statt Bonus-Historie','CurrentSeasonFinanceRepository statt Bonus-Historie');
            write('tests/run_kf_0_25_2_fix_regression_test.js',s);
          }

          // 0.25.4: cloned worlds need their own external finance stores.
          {
            let s=read('tests/run_kf_0_25_4_fix_regression_test.js');
            s=replaceReq(s,'prepareCareerSlotLifecycle,financeEventSum,financePlacementBonus','prepareCareerSlotLifecycle,financeEventSum,financeEventsForSeason,CurrentSeasonFinanceRepository,financePlacementBonus','0254 exports');
            s=replaceReq(s,"T.startNewCareer();\nconst base=JSON.parse(JSON.stringify(T.AppState.world));","T.startNewCareer();\nlet cloneSeq=0;function cloneWorldWithFinance(source,label){const copy=JSON.parse(JSON.stringify(source)),seasonId=Number(source.meta.seasonNumber||1);copy.meta.id=String(source.meta.id)+'_'+label+'_'+(++cloneSeq);for(const cid of source.clubs.order){T.CurrentSeasonFinanceRepository.replaceClubEvents(copy,cid,seasonId,T.financeEventsForSeason(source,cid,seasonId).map(ev=>JSON.parse(JSON.stringify(ev))));}return copy;}\nconst base=cloneWorldWithFinance(T.AppState.world,'base');",'0254 clone helper');
            s=replaceReq(s,"const normal=JSON.parse(JSON.stringify(base)), fast=JSON.parse(JSON.stringify(base));","const normal=cloneWorldWithFinance(base,'normal'), fast=cloneWorldWithFinance(base,'fast');",'0254 normal/fast clone');
            s=replaceReq(s,"function salaryState(w){return w.clubs.order.map(id=>({id,amount:T.financeEventSum(w,id,season,ev=>ev.type==='salaryExpense'),slots:((((w.clubFinances||{}).byClub||{})[id]||{}).financeEvents||[]).filter(ev=>ev.type==='salaryExpense').reduce((n,ev)=>n+Number(ev.slotsApplied||0),0)}));}","function salaryState(w){return w.clubs.order.map(id=>({id,amount:T.financeEventSum(w,id,season,ev=>ev.type==='salaryExpense'),slots:T.financeEventsForSeason(w,id,season).filter(ev=>ev.type==='salaryExpense').reduce((n,ev)=>n+Number(ev.slotsApplied||0),0)}));}",'0254 salary state');
            s=replaceReq(s,"const fresh=JSON.parse(JSON.stringify(base)), sampleClub=fresh.clubs.byId[fresh.clubs.order[0]], sampleFinance=fresh.clubFinances.byClub[sampleClub.id];","const fresh=cloneWorldWithFinance(base,'fresh'), sampleClub=fresh.clubs.byId[fresh.clubs.order[0]], sampleFinance=fresh.clubFinances.byClub[sampleClub.id];",'0254 fresh clone');
            s=replaceReq(s,"const w=JSON.parse(JSON.stringify(base)), cid=w.clubs.order[0], club=w.clubs.byId[cid], oldOrder=w.clubs.order.slice();w.clubs.order=[cid];","const w=cloneWorldWithFinance(base,'placement_'+pos), cid=w.clubs.order[0], club=w.clubs.byId[cid], oldOrder=w.clubs.order.slice();w.clubs.order=[cid];",'0254 placement clone');
            s=replaceReq(s,"const count=((((w.clubFinances||{}).byClub||{})[cid]||{}).financeEvents||[]).filter(ev=>ev.type==='placementBonus'&&Number(ev.seasonId||0)===season).length;","const count=T.financeEventsForSeason(w,cid,season).filter(ev=>ev.type==='placementBonus').length;",'0254 placement count');
            write('tests/run_kf_0_25_4_fix_regression_test.js',s);
          }

          // 0.25.6: sponsor income comes from current finance repository.
          {
            let s=read('tests/run_kf_0_25_6_fix_regression_test.js');
            s=replaceReq(s,'kf0255AutoFillAiSponsorSlots,buildCalendar};','kf0255AutoFillAiSponsorSlots,buildCalendar,financeEventsForSeason};','0256 export');
            s=replaceReq(s,"const s3IncomeMissing=aiIds.filter(id=>{const cs=T.sponsorContractsForClub(w,id,3);const events=((((w.clubFinances||{}).byClub||{})[id]||{}).financeEvents||[]).filter(ev=>ev&&ev.type==='sponsorIncome'&&Number(ev.seasonId||0)===3);return events.length!==cs.length;});","const s3IncomeMissing=aiIds.filter(id=>{const cs=T.sponsorContractsForClub(w,id,3);const events=T.financeEventsForSeason(w,id,3).filter(ev=>ev&&ev.type==='sponsorIncome');return events.length!==cs.length;});",'0256 income check');
            write('tests/run_kf_0_25_6_fix_regression_test.js',s);
          }

          // 0.26.0 real storage sample: event keys from external ledger.
          {
            let s=read('tests/run_kf_0_26_0_real_match_storage_sample_test.js');
            s=replaceReq(s,'recentMatchesForClub,CurrentSeasonMatchRepository};','recentMatchesForClub,CurrentSeasonMatchRepository,CurrentSeasonFinanceRepository};','0260 real export');
            s=replaceReq(s,"const financeEventKeyCount=Object.values(((w.clubFinances||{}).byClub)||{}).reduce((sum,entry)=>sum+((entry&&entry.financeEvents)||[]).filter(ev=>ev&&ev.eventKey).length,0);","const financeEventKeyCount=T.CurrentSeasonFinanceRepository.eventKeys(w,1).length;",'0260 event key count');
            write('tests/run_kf_0_26_0_real_match_storage_sample_test.js',s);
          }

          // 0.27.0 storage benchmark reads finance store externally under current runtime.
          {
            let s=read('tests/run_kf_0_27_0_server_storage_test.js');
            s=replaceReq(s,'WorldRepository,CurrentSeasonMatchRepository,renderMatchInfoModalBody};','WorldRepository,CurrentSeasonMatchRepository,CurrentSeasonFinanceRepository,renderMatchInfoModalBody};','0270 storage export');
            s=replaceReq(s,"function financeStats(w){let count=0,bytes=0;Object.values((((w||{}).clubFinances||{}).byClub)||{}).forEach(f=>{const rows=(f&&f.financeEvents)||[];count+=rows.length;bytes+=jsonBytes(rows);});return{count,bytes};}","function financeStats(w){const season=Number(((w||{}).meta||{}).seasonNumber||1);return{count:T.CurrentSeasonFinanceRepository.count(w,season),bytes:T.CurrentSeasonFinanceRepository.serializedBytes(w,season)};}",'0270 finance stats');
            write('tests/run_kf_0_27_0_server_storage_test.js',s);
          }

          // 0.26.1 bonus regression: preserve legacy embedded ledger test while current worlds use external repository.
          {
            let s=read('tests/run_kf_0_26_1_bonus_event_cleanup_test.js');
            s=replaceReq(s,'migrateWorldDataTruthToCurrent,addFinanceEvent,financeCurrentCash,worldRecordForGameState,assignTrainerClub};','migrateWorldDataTruthToCurrent,addFinanceEvent,financeCurrentCash,financeEventsForSeason,CurrentSeasonFinanceRepository,worldRecordForGameState,assignTrainerClub};','0261 exports');
            s=replaceReq(s,"const clubFinance=w.clubFinances.byClub[clubId].financeEvents||[];","const clubFinance=T.financeEventsForSeason(w,clubId,Number(w.meta.seasonNumber||1));",'0261 club finance');
            s=replaceReq(s,"const beforeReloadCount=(reloaded.clubFinances.byClub[clubId].financeEvents||[]).length;","const beforeReloadCount=T.financeEventsForSeason(reloaded,clubId,Number(reloaded.meta.seasonNumber||1)).length;",'0261 before reload');
            s=replaceReq(s,"const afterReloadCount=(reloaded.clubFinances.byClub[clubId].financeEvents||[]).length;","const afterReloadCount=T.financeEventsForSeason(reloaded,clubId,Number(reloaded.meta.seasonNumber||1)).length;",'0261 after reload');
            s=replaceReq(s,"const seasonEvents=(w.clubFinances.byClub[clubId].financeEvents||[]).filter(ev=>ev.eventKey===seasonKey);","const seasonEvents=T.financeEventsForSeason(w,clubId,season).filter(ev=>ev.eventKey===seasonKey);",'0261 season events');
            s=replaceReq(s,"const loanWorld=JSON.parse(JSON.stringify(w));T.migrateWorldDataTruthToCurrent(loanWorld);const loanPlayer=loanWorld.players.byId[playerId];","const loanWorld=JSON.parse(JSON.stringify(w));loanWorld.meta.id=String(w.meta.id)+'_loan_test';T.migrateWorldDataTruthToCurrent(loanWorld);for(const cid of w.clubs.order){T.CurrentSeasonFinanceRepository.replaceClubEvents(loanWorld,cid,season,T.financeEventsForSeason(w,cid,season).map(ev=>JSON.parse(JSON.stringify(ev))));}const loanPlayer=loanWorld.players.byId[playerId];",'0261 loan clone');
            s=replaceReq(s,"const loanEvents=[...(loanWorld.clubFinances.byClub[clubId].financeEvents||[]),...(loanWorld.clubFinances.byClub[club2].financeEvents||[])].filter(ev=>ev.eventKey===loanKey);","const loanEvents=[...T.financeEventsForSeason(loanWorld,clubId,season),...T.financeEventsForSeason(loanWorld,club2,season)].filter(ev=>ev.eventKey===loanKey);",'0261 loan events');
            s=replaceReq(s,"const pBefore=(w.clubFinances.byClub[club2].financeEvents||[]).length,bBefore=(w.clubFinances.byClub[club3].financeEvents||[]).length,mailBefore=((w.mailbox||{}).order||[]).length;","const pBefore=T.financeEventsForSeason(w,club2,season).length,bBefore=T.financeEventsForSeason(w,club3,season).length,mailBefore=((w.mailbox||{}).order||[]).length;",'0261 transfer before');
            s=replaceReq(s,"const pAfter=(w.clubFinances.byClub[club2].financeEvents||[]).filter(ev=>ev.eventKey===transferKey),bAfter=(w.clubFinances.byClub[club3].financeEvents||[]).filter(ev=>ev.eventKey===transferKey),mailAfter=((w.mailbox||{}).order||[]).length;","const pAfter=T.financeEventsForSeason(w,club2,season).filter(ev=>ev.eventKey===transferKey),bAfter=T.financeEventsForSeason(w,club3,season).filter(ev=>ev.eventKey===transferKey),mailAfter=((w.mailbox||{}).order||[]).length;",'0261 transfer after');
            s=replaceReq(s,"const transferReload=JSON.parse(JSON.stringify(w));T.migrateWorldDataTruthToCurrent(transferReload);\nconst pCountBefore=(transferReload.clubFinances.byClub[club2].financeEvents||[]).length,bCountBefore=(transferReload.clubFinances.byClub[club3].financeEvents||[]).length;","const transferReload=JSON.parse(JSON.stringify(w));transferReload.meta.id=String(w.meta.id)+'_transfer_reload_test';T.migrateWorldDataTruthToCurrent(transferReload);for(const cid of w.clubs.order){T.CurrentSeasonFinanceRepository.replaceClubEvents(transferReload,cid,season,T.financeEventsForSeason(w,cid,season).map(ev=>JSON.parse(JSON.stringify(ev))));}\nconst pCountBefore=T.financeEventsForSeason(transferReload,club2,season).length,bCountBefore=T.financeEventsForSeason(transferReload,club3,season).length;",'0261 transfer reload');
            s=replaceReq(s,"check('Transferklausel bleibt nach Reload ohne Doppelbuchung',pCountBefore===(transferReload.clubFinances.byClub[club2].financeEvents||[]).length&&bCountBefore===(transferReload.clubFinances.byClub[club3].financeEvents||[]).length,{pCountBefore,pCountAfter:(transferReload.clubFinances.byClub[club2].financeEvents||[]).length,bCountBefore,bCountAfter:(transferReload.clubFinances.byClub[club3].financeEvents||[]).length});","const pCountAfter=T.financeEventsForSeason(transferReload,club2,season).length,bCountAfter=T.financeEventsForSeason(transferReload,club3,season).length;\ncheck('Transferklausel bleibt nach Reload ohne Doppelbuchung',pCountBefore===pCountAfter&&bCountBefore===bCountAfter,{pCountBefore,pCountAfter,bCountBefore,bCountAfter});",'0261 transfer reload check');
            s=replaceReq(s,"const legacy=JSON.parse(JSON.stringify(w));legacy.meta.schemaVersion='kf-core-0.26.0';legacy.history.bonusEvents=[];","const legacy=JSON.parse(JSON.stringify(w));legacy.meta.id=String(w.meta.id)+'_legacy_0260_test';legacy.meta.schemaVersion='kf-core-0.26.0';legacy.history.bonusEvents=[];for(const cid of w.clubs.order){legacy.clubFinances.byClub[cid].financeEvents=T.financeEventsForSeason(w,cid,season).map(ev=>JSON.parse(JSON.stringify(ev)));delete legacy.clubFinances.byClub[cid].financeTotals;delete legacy.clubFinances.byClub[cid].financeEventCount;delete legacy.clubFinances.byClub[cid].financeLedgerKind;delete legacy.clubFinances.byClub[cid].financeLedgerSeason;}",'0261 legacy world');
            s=replaceReq(s,"const migratedPay=legacy.clubFinances.byClub[club2].financeEvents.find(ev=>ev.id==='legacy-pay'),migratedIncome=legacy.clubFinances.byClub[club3].financeEvents.find(ev=>ev.id==='legacy-income');","const migratedPay=T.financeEventsForSeason(legacy,club2,season).find(ev=>ev.id==='legacy-pay'),migratedIncome=T.financeEventsForSeason(legacy,club3,season).find(ev=>ev.id==='legacy-income');",'0261 migrated events');
            write('tests/run_kf_0_26_1_bonus_event_cleanup_test.js',s);
          }

          // New cleanup regression.
          write('tests/run_kf_0_27_2_repository_asset_cleanup_test.js',`const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=path.resolve(__dirname,'..');
          const read=r=>fs.readFileSync(path.join(root,r),'utf8');
          const exists=r=>fs.existsSync(path.join(root,r));
          const report={passed:true,checks:[]};
          function check(name,ok,details={}){report.checks.push({name,ok:!!ok,details});if(!ok)report.passed=false;}
          const db=JSON.parse(read('data/db3_vereine/db3_vereine_final.json'));
          check('DB3 has 432 clubs and only crestAsset as fixed club image asset',db.clubs.length===432&&db.clubs.every(c=>c.crestAsset&&!('homeKitAsset' in c)&&!('awayKitAsset' in c)),{clubs:db.clubs.length});
          const ctx={window:{},console};vm.createContext(ctx);vm.runInContext(read('src/static-data.js'),ctx);const sd=ctx.window.KFStaticData;
          check('StaticData mirrors kit-asset cleanup',sd.clubs.length===432&&sd.clubs.every(c=>c.crestAsset&&!('homeKitAsset' in c)&&!('awayKitAsset' in c)),{clubs:sd.clubs.length});
          const app=read('src/app.bundle.js');
          check('Runtime version/schema are KF_0.27.2',app.includes("var KF_VERSION = '0.27.2';")&&app.includes("world.meta.schemaVersion='kf-core-0.27.2'")&&app.includes("record.schemaVersion='kf-world-record-0.27.2'"),{});
          check('Finance architecture metadata points to external ledger',app.includes("processedFinancialEvents: 'CurrentSeasonFinanceRepository[worldId][season][clubId][eventId].eventKey (current season only)'"),{});
          check('Current kit renderer uses shared designer assets',app.includes("var DESIGNER_BASE_COLORS = ['white','black','navy'")&&app.includes("'./assets/kits/masks_2/'")&&app.includes("'./assets/kits/masks_3/'"),{});
          const legacyClubFiles=[];for(const ent of fs.readdirSync(path.join(root,'assets','clubs'),{withFileTypes:true})){if(!ent.isDirectory())continue;for(const n of ['home.png','away.png','README.md'])if(exists(path.join('assets','clubs',ent.name,n)))legacyClubFiles.push(path.join(ent.name,n));}
          check('Legacy per-club kit placeholders/readmes are gone',legacyClubFiles.length===0,{legacyClubFiles:legacyClubFiles.slice(0,10)});
          const removed=['assets/ui/kits','assets/ui/icons','assets/ui/tiles','assets/common/sponsor_placeholder.png','assets/kits/bases/base_lime.png','assets/tiles/tile_lineup_bg.png','assets/tiles/tile_squad_bg.png','assets/tiles/tile_statistics_bg.png','data/db3_vereine/db3_vereine_final.js','data/source_archives','tests/_tmp_profile_nosave.js'];
          check('Confirmed obsolete repository artifacts are gone',removed.every(x=>!exists(x)),{stillPresent:removed.filter(exists)});
          const requiredBases=['white','black','navy','royal_blue','sky_blue','red','dark_red','green','dark_green','yellow','orange','purple','pink','brown','gray','dark_gray','teal','turquoise','cream','gold'];
          const requiredMasks=['style_001','style_002','style_003','style_004','style_005'].map(x=>'assets/kits/masks_2/'+x+'.png').concat(['accent_001','accent_002','accent_003'].map(x=>'assets/kits/masks_3/'+x+'.png'));
          check('All dynamic kit designer assets remain',requiredBases.every(x=>exists('assets/kits/bases/'+x+'.png'))&&requiredMasks.every(exists),{});
          check('Generated report JSONs are ignored',read('.gitignore').includes('reports/*.json'),{});
          const out=path.join(root,'reports','kf_0.27.2_repository_asset_cleanup_test.json');fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,JSON.stringify(report,null,2));console.log(JSON.stringify({...report,reportFile:out},null,2));process.exit(report.passed?0:1);
          `.replace(/^          /gm,''));

          let suite=read('tests/run_current_regression_suite.js');
          if(!suite.includes('run_kf_0_27_2_repository_asset_cleanup_test.js')) suite=suite.replace("'tests/run_kf_0_27_1_current_season_finance_store_test.js'","'tests/run_kf_0_27_1_current_season_finance_store_test.js',\n  'tests/run_kf_0_27_2_repository_asset_cleanup_test.js'");
          write('tests/run_current_regression_suite.js',suite);

          // DB3 documentation: JSON is the canonical export.
          let db3=read('data/db3_vereine/db3_integrations_readme.md');
          db3=db3.replace(/- \`db3_vereine_final\.js\`[^\n]*\n/,'')
                 .replace('- \`db3_vereine_final.json\` – dieselben Daten als JSON','- \`db3_vereine_final.json\` – kanonischer strukturierter Export fuer Runtime-Build, Tests und Asset-Werkzeuge');
          write('data/db3_vereine/db3_integrations_readme.md',db3);

          // Asset docs.
          let origin=read('docs/assets/Asset_Herkunft.md');
          if(!origin.includes('## Trikots')) origin+="\n## Trikots\n\nTrikots werden nicht als fertige club-spezifische home.png/away.png gespeichert. Die aktuelle Wahrheit sind die Trikotdesigner-Werte im Weltzustand; gerendert wird aus den gemeinsam genutzten Bases und Masken unter \`assets/kits/\`. Die statischen Vereinsfarben aus DB3 dienen nur zur Initialisierung eines neuen Vereinszustands.\n";
          write('docs/assets/Asset_Herkunft.md',origin);
          let crest=read('docs/assets/Vereinswappen_Status.md').replace('Vollständigkeit des aktuellen Repository-Assetstands:','Vollständigkeit des aktuellen Repository-Assetstands (Wappen plus gemeinsame Trikotdesigner-Assets):');
          write('docs/assets/Vereinswappen_Status.md',crest);

          // GitHub migration note.
          let gh=read('docs/projekt/GitHub_Umstellung.md');
          gh=gh.replace('# GitHub-Umstellung – Ausgangsbasis KF_0.27.1','# GitHub-Umstellung – Ausgangsbasis KF_0.27.2')
               .replace('KF_0.27.1 wird als saubere neue Repository-Basis verwendet.','KF_0.27.2 ist die bereinigte Repository-Basis. Der Spielkern bleibt fachlich unverändert; entfernt wurden nachweislich obsolete Assets und doppelte Entwicklungsartefakte.')
               .replace('liefert eine vollständige Liste fehlender Vereinswappen und Trikots. Damit werden Assetlücken beim GitHub-Neustart sichtbar, ohne sie stillschweigend mit falschen Dateien zu füllen.','liefert die Wappenabdeckung sowie die Vollstaendigkeit der gemeinsam genutzten Trikotdesigner-Bases und -Masken. Club-spezifische Trikot-PNGs sind kein Bestandteil der aktuellen Architektur mehr.');
          write('docs/projekt/GitHub_Umstellung.md',gh);

          // README current version and cleanup summary.
          let readme=read('README.md');
          readme=readme.replace('# Kabinenfieber KF_0.27.1','# Kabinenfieber KF_0.27.2')
                       .replace('KF_0.27.1 setzt den Server-/Persistenzumbau aus KF_0.27.0 fort. Nach den Vollmatches werden nun auch die Finanzbuchungen der laufenden Saison aus dem staendig serialisierten \`WorldRecord\` ausgelagert.','KF_0.27.2 bereinigt auf Basis des abgeschlossenen KF_0.27.1-Stands die Repository- und Assetstruktur, ohne Gameplay oder Simulation zu veraendern. Die Match- und Finance-Segmentierung aus KF_0.27.0/0.27.1 bleibt unveraendert aktiv.');
          if(!readme.includes('## Neu in KF_0.27.2')) readme=readme.replace('## Neu in KF_0.27.1',`## Neu in KF_0.27.2

          - club-spezifische 1x1-Platzhalter \`home.png\` / \`away.png\` und ihre \`homeKitAsset\`/\`awayKitAsset\`-Felder entfernt; Trikots kommen ausschliesslich aus dem Trikotdesigner.
          - nachweislich tote alte Kit-Templates, doppelte Icons/Tiles, Sponsor-/Nation-Platzhalter und ein ungenutztes Base-Asset entfernt.
          - redundanten DB3-JS-Export und alte Source-Archive entfernt; JSON bleibt kanonische DB3-Entwicklungsquelle.
          - generierte Test-JSONs werden nicht mehr versioniert. Release Notes und Validation Summaries bleiben im Repository.
          - Build-/Finance-Architekturmetadaten auf den tatsaechlichen KF_0.27.2-Stand korrigiert.
          - bestehende Trikotdesigner-Bases/Masken bleiben vollstaendig erhalten.
          - Legacy-Migration fuer KF_0.26.0-FinanceEvents abgesichert.

          ## Grundlage aus KF_0.27.1`.replace(/^          /gm,''));
          readme=readme.replace('KF_0.27.1 dient zugleich als technische Ausgangsbasis fuer den neuen GitHub-Stand.','KF_0.27.2 dient als bereinigte technische Ausgangsbasis fuer den neuen GitHub-Stand.');
          write('README.md',readme);

          // Mandatory human documentation.
          let human=read('docs/projekt/Beschreibung_Projekt_fuer_Menschen.md');
          human=human.replace('# Kabinenfieber - Stand KF_0.27.1','# Kabinenfieber - Stand KF_0.27.2')
                     .replace('App-Version: \`KF_0.27.1\`','App-Version: \`KF_0.27.2\`')
                     .replace('- Fussballwelt/GameState: \`kf-core-0.27.1\`','- Fussballwelt/GameState: \`kf-core-0.27.2\`')
                     .replace('- WorldRecord: \`kf-world-record-0.27.1\`','- WorldRecord: \`kf-world-record-0.27.2\`')
                     .replace('## 15. Tests aktueller Stand KF_0.27.1','## 15. Tests aktueller Stand KF_0.27.2')
