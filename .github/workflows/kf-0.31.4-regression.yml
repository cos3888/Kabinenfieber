name: KF 0.31.4 Regression

on:
  push:
    branches:
      - fix/kf-0.31.4-save-object-isolation-integrity
  pull_request:
    branches: [ main ]

jobs:
  large-world-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: KF 0.31.4 large-world bounded-heap reconstruction
        run: node tests/run_kf_0_31_4_large_world_memory_test.js
