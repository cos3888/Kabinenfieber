name: KF 0.31.4 Regression

on:
  push:
    branches:
      - fix/kf-0.31.4-save-object-isolation-integrity
  pull_request:
    branches: [ main ]

jobs:
  targeted-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: KF 0.31.4 save isolation and integrity
        run: npm run test:0314
      - name: KF 0.31.3 cold load and compaction
        run: npm run test:0313
